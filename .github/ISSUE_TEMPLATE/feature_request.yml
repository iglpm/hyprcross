name: Feature Request
description: Propose a new cross target, engine enhancement, or optimization
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make cross-compilation even faster or support new platforms? Let us know!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation or workflow hurdle.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: Detailed explanation of how you envision the feature working in Hyprcross.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
    validations:
      required: false
