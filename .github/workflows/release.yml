name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: [self-hosted, Linux, X64, docker-builds]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-apple-darwin
            archive: tar.gz
          - target: x86_64-apple-darwin
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # hyprlnk, which hyprcross links with, is a submodule. While it is private the workflow's
      # own token can't read it: HYPRLNK_TOKEN, with read access to both repositories, can.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Podman and build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns
          podman info || true

      - name: Build hyprcross and cargo-hyprcross locally first
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --locked -p hyprcross -p cargo-hyprcross
          echo "$PWD/target/release" >> $GITHUB_PATH

      - name: Cross-compile target with hyprcross
        env:
          HYPRCROSS_CONTAINER_ENGINE: podman
        run: |
          # Nutzt das frisch gebaute hyprcross im PATH für das spezifische Target
          hyprcross cross build --release --locked --target ${{ matrix.target }} || \
          cargo run --release -p hyprcross -- cross build --release --locked --target ${{ matrix.target }}

      - name: Package release asset (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          if [ ! -d "$bin_dir" ]; then
            bin_dir=".rune/target/${{ matrix.target }}/release"
          fi
          
          mkdir -p package
          cp "$bin_dir/hyprcross" "$bin_dir/cargo-hyprcross" README.md LICENSE*.md package/ 2>/dev/null || cp "$bin_dir/hyprcross" "$bin_dir/cargo-hyprcross" package/
          
          tar -czf hyprcross-${{ matrix.target }}.tar.gz -C package .
          if command -v sha256sum >/dev/null; then
            sha256sum hyprcross-${{ matrix.target }}.tar.gz > hyprcross-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 hyprcross-${{ matrix.target }}.tar.gz > hyprcross-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package release asset (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          if [ ! -d "$bin_dir" ]; then
            bin_dir=".rune/target/${{ matrix.target }}/release"
          fi

          mkdir -p package
          cp "$bin_dir/hyprcross.exe" "$bin_dir/cargo-hyprcross.exe" README.md LICENSE*.md package/ 2>/dev/null || cp "$bin_dir/hyprcross.exe" "$bin_dir/cargo-hyprcross.exe" package/

          cd package
          zip -r ../hyprcross-${{ matrix.target }}.zip *
          cd ..
          sha256sum hyprcross-${{ matrix.target }}.zip > hyprcross-${{ matrix.target }}.zip.sha256

      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: |
            hyprcross-${{ matrix.target }}.*

  publish:
    needs: build
    runs-on: [self-hosted, Linux, X64, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[?" v "\\]?" { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md > notes.md || echo "Release v$version" > notes.md
          else
            echo "Release v$version" > notes.md
          fi
          cat notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
          files: dist/*
          body_path: notes.md
