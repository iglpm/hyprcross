name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: [self-hosted, Linux, X64, docker-builds]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            archive: tar.gz
          - target: aarch64-apple-darwin
            archive: tar.gz
          - target: x86_64-apple-darwin
            archive: tar.gz
          - target: x86_64-pc-windows-gnu
            archive: zip
          - target: i686-pc-windows-gnu
            archive: zip
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # hyprlnk, which hyprcross links with, is a submodule.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure container and build environment
        run: |
          mkdir -p "${RUNNER_TEMP}/.docker"
          echo "DOCKER_CONFIG=${RUNNER_TEMP}/.docker" >> "$GITHUB_ENV"

          if ! command -v clang >/dev/null 2>&1 || ! command -v llvm-ar >/dev/null 2>&1; then
            echo "Installing clang and llvm for cross-compilation..."
            (
              flock -x 200
              while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "Waiting for concurrent apt-get lock to release..."
                sleep 2
              done
              sudo apt-get update -y || true
              sudo apt-get install -y clang llvm
            ) 200>/tmp/runner-apt.lock
          fi

          if command -v docker >/dev/null 2>&1; then
            echo "Found Docker engine: $(docker --version)"
            echo "HYPRCROSS_CONTAINER_ENGINE=docker" >> "$GITHUB_ENV"
          elif command -v podman >/dev/null 2>&1; then
            echo "Found Podman engine: $(podman --version)"
            echo "HYPRCROSS_CONTAINER_ENGINE=podman" >> "$GITHUB_ENV"
          else
            echo "No container engine found; acquiring lock to install..."
            (
              flock -x 200
              while sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; do
                echo "Waiting for concurrent apt-get lock to release..."
                sleep 2
              done
              sudo apt-get update -y || true
              sudo apt-get install -y podman uidmap slirp4netns
            ) 200>/tmp/runner-apt.lock
            echo "HYPRCROSS_CONTAINER_ENGINE=podman" >> "$GITHUB_ENV"
          fi

      - name: Build hyprcross and cargo-hyprcross locally first
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --locked -p hyprcross -p cargo-hyprcross || (cargo clean && cargo build --release --locked -p hyprcross -p cargo-hyprcross)
          echo "$PWD/target/release" >> $GITHUB_PATH

      - name: Cross-compile target with hyprcross
        run: |
          hyprcross build --release --locked --target ${{ matrix.target }} -p hyprcross -p cargo-hyprcross

      - name: Package release asset (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          if [ ! -d "$bin_dir" ]; then
            bin_dir=".igel/target/${{ matrix.target }}/release"
          fi
          
          mkdir -p package
          cp "$bin_dir/hyprcross" "$bin_dir/cargo-hyprcross" README.md LICENSE*.md package/ 2>/dev/null || cp "$bin_dir/hyprcross" "$bin_dir/cargo-hyprcross" package/
          
          tar -czf hyprcross-${{ matrix.target }}.tar.gz -C package .
          if command -v sha256sum >/dev/null; then
            sha256sum hyprcross-${{ matrix.target }}.tar.gz > hyprcross-${{ matrix.target }}.tar.gz.sha256
          else
            shasum -a 256 hyprcross-${{ matrix.target }}.tar.gz > hyprcross-${{ matrix.target }}.tar.gz.sha256
          fi

      - name: Package release asset (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          bin_dir="target/${{ matrix.target }}/release"
          if [ ! -d "$bin_dir" ]; then
            bin_dir=".igel/target/${{ matrix.target }}/release"
          fi

          mkdir -p package
          cp "$bin_dir/hyprcross.exe" "$bin_dir/cargo-hyprcross.exe" README.md LICENSE*.md package/ 2>/dev/null || cp "$bin_dir/hyprcross.exe" "$bin_dir/cargo-hyprcross.exe" package/

          cd package
          if command -v zip >/dev/null 2>&1; then
            zip -r ../hyprcross-${{ matrix.target }}.zip *
          else
            python3 -c "import shutil; shutil.make_archive('../hyprcross-${{ matrix.target }}', 'zip', '.')"
          fi
          cd ..
          sha256sum hyprcross-${{ matrix.target }}.zip > hyprcross-${{ matrix.target }}.zip.sha256

      - name: Upload intermediate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.target }}
          path: |
            hyprcross-${{ matrix.target }}.*

  publish-crates:
    name: Publish to Crates.io
    needs: build
    runs-on: [self-hosted, Linux, X64, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish hyprcross
        run: |
          cargo publish -p hyprcross --token "${{ secrets.CRATESIO_TOKEN }}"

      - name: Wait for crates.io index propagation
        run: sleep 20

      - name: Publish cargo-hyprcross
        run: |
          cargo publish -p cargo-hyprcross --token "${{ secrets.CRATESIO_TOKEN }}"

  publish:
    needs: [build, publish-crates]
    runs-on: [self-hosted, Linux, X64, ci]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        run: |
          python3 scripts/generate_release_notes.py notes.md
          cat notes.md

      - name: Determine release type
        id: release_type
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" == *"-rc"* || "$tag" == *"-beta"* || "$tag" == *"-alpha"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
            echo "release_title=hyprcross $tag (Beta / Pre-release)" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
            echo "release_title=hyprcross $tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}
          name: ${{ steps.release_type.outputs.release_title }}
          files: dist/*
          body_path: notes.md
          prerelease: ${{ steps.release_type.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release_type.outputs.make_latest }}

