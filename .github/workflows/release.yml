name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-release:
    name: Build Release Asset (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      # hyprlnk, which hyprcross links with, is a submodule. While it is private the workflow's
      # own token can't read it: HYPRLNK_TOKEN, with read access to both repositories, can.
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.HYPRLNK_TOKEN || github.token }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # zstd and mimalloc compile C: musl targets need musl's compiler.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release asset (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../hyprcross-${{ matrix.target }}.tar.gz hyprcross cargo-hyprcross
          cd ../../..
          shasum -a 256 hyprcross-${{ matrix.target }}.tar.gz > hyprcross-${{ matrix.target }}.tar.gz.sha256

      - name: Package release asset (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../hyprcross-${{ matrix.target }}.zip hyprcross.exe cargo-hyprcross.exe
          cd ../../..
          sha256sum hyprcross-${{ matrix.target }}.zip > hyprcross-${{ matrix.target }}.zip.sha256

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            hyprcross-${{ matrix.target }}.*
