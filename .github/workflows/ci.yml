name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      # hyprlnk, which hyprcross links with, is a submodule. While it is private the workflow's
      # own token can't read it: HYPRLNK_TOKEN, with read access to both repositories, can.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.HYPRLNK_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Tests
        run: cargo test --all-targets --all-features --locked

      - name: Doctor
        run: cargo run --locked -- doctor

  scripts:
    name: Image scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        working-directory: docker
        run: shellcheck -x scripts/*.sh scripts/hyprcross-runner matrix.sh update-pins.sh
