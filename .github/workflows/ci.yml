name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ci
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    steps:
      # Git Credentials global nur für Nicht-macOS setzen, um Hängenbleiben im Keychain zu verhindern
      - name: Configure Git Credentials for Submodules (Non-macOS)
        if: runner.os != 'macOS'
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # hyprlnk, which hyprcross links with, is a submodule.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked

      - name: Tests
        run: cargo test --all-targets --all-features --locked

      - name: Doctor
        run: cargo run --locked -- doctor

  scripts:
    name: Image scripts
    runs-on: ci
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RUNIFIED_TOKEN || secrets.HYPRLNK_TOKEN || github.token }}

      - name: shellcheck
        working-directory: docker
        run: shellcheck -x scripts/*.sh scripts/hyprcross-runner matrix.sh update-pins.sh
