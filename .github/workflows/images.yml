name: Images

# Builds the per-target images in docker/, tests each one by cross-compiling (and, where the
# image can run the target's programs, testing) docker/test/smoke with hyprcross itself, and
# pushes them to ghcr.io/<owner>/hyprcross/<target>.
#
#   push to main      images its changes reach are rebuilt     -> :latest, :<date>, :sha-<commit>
#   every Monday      all images, with the week's package updates   -> :latest, :<date>
#   tag v1.2.3        all images                                 -> :1.2.3, :1.2
#   pull request      images its changes reach (a new hyprlnk: all): built and tested, not pushed
#   manual run        the targets given, or all

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["docker/**", ".github/workflows/images.yml"]
  pull_request:
    # hyprlnk links the smoke tests: a pull request moving it tests every image.
    paths: ["docker/**", ".github/workflows/images.yml", "hyprlnk"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: "Targets to build, separated by spaces (empty: all)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    runs-on: [self-hosted, Linux, X64, docker-builds]
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      prefix: ${{ steps.prefix.outputs.prefix }}
      push: ${{ steps.push.outputs.push }}
      refresh: ${{ steps.refresh.outputs.week }}
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - id: prefix
        name: Image prefix
        # Registry paths must be lowercase; owners may not be.
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hyprcross" >> "$GITHUB_OUTPUT"

      - id: push
        name: Push?
        # Pull requests (forks' included) only build and test.
        run: echo "push=${{ github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"

      - id: refresh
        name: Package refresh key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - id: matrix
        name: Targets
        env:
          WANTED: ${{ github.event.inputs.targets }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          targets="$WANTED"
          # A push to a branch or a pull request rebuilds the images its changes reach: a
          # Dockerfile its own image, a script or other file every image whose Dockerfile names
          # it (lib.sh: all of them). Anything else, or a range that can't be compared, rebuilds
          # everything.
          if { [ "$EVENT" = pull_request ] || { [ "$EVENT" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; }; } \
              && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            all=false
            targets=""
            for f in $(git diff --name-only "$BASE" HEAD -- docker .github/workflows/images.yml hyprlnk); do
              case "$f" in
                # A new hyprlnk links every smoke test; the images themselves don't change.
                hyprlnk) if [ "$EVENT" = pull_request ]; then all=true; fi ;;
                docker/Dockerfile.*)
                  # A deleted Dockerfile has nothing to build.
                  if [ -f "$f" ]; then targets="$targets ${f#docker/Dockerfile.}"; fi ;;
                docker/README.md | docker/update-pins.sh) ;;
                docker/*)
                  users="$(grep -lF "${f#docker/}" docker/Dockerfile.* || true)"
                  if [ -z "$users" ]; then all=true; fi
                  for u in $users; do targets="$targets ${u#docker/Dockerfile.}"; done ;;
                *) all=true ;;
              esac
            done
            if [ "$all" = true ]; then
              targets=""
            elif [ -z "$targets" ]; then
              echo "matrix=[]" >> "$GITHUB_OUTPUT"
              exit 0
            else
              targets="$(printf '%s\n' $targets | sort -u | tr '\n' ' ')"
            fi
          fi
          read -ra list <<< "$targets"
          echo "matrix=$(docker/matrix.sh "${list[@]}")" >> "$GITHUB_OUTPUT"

  hyprcross:
    name: Build hyprcross
    runs-on: [self-hosted, Linux, X64, docker-builds]
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      # hyprlnk, which hyprcross links with, is a submodule. While it is private the workflow's
      # own token can't read it: HYPRLNK_TOKEN, with read access to both repositories, can.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: hyprcross
          path: target/release/hyprcross
          retention-days: 1

  image:
    name: ${{ matrix.target }}
    needs: [plan, hyprcross]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: [self-hosted, Linux, X64, docker-builds]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      IMAGE: ${{ needs.plan.outputs.prefix }}/${{ matrix.target }}
      SMOKE_IMAGE: hyprcross-smoke/${{ matrix.target }}:ci
    steps:
      - name: Configure Git Credentials for Submodules
        env:
          TOKEN: ${{ secrets.RUNIFIED_TOKEN || github.token }}
        run: |
          git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.RUNIFIED_TOKEN || github.token }}

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, ',')
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: needs.plan.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'push' && github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=hyprcross ${{ matrix.target }}
            dev.hyprcross.target=${{ matrix.target }}

      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.target }}
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HYPRCROSS_REFRESH=${{ needs.plan.outputs.refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ needs.plan.outputs.push == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/download-artifact@v4
        with:
          name: hyprcross
          path: ${{ runner.temp }}/hyprcross

      - name: Smoke test (${{ matrix.smoke }})
        working-directory: docker/test/smoke
        env:
          HYPRCROSS_CONTAINER_ENGINE: docker
          HYPRCROSS_IMAGE_REPOSITORY: hyprcross-smoke
          HYPRCROSS_IMAGE_TAG: ci
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          hyprcross="$RUNNER_TEMP_DIR/hyprcross/hyprcross"
          chmod +x "$hyprcross"
          "$hyprcross" ${{ matrix.smoke }} -v -t ${{ matrix.target }} --engine container --builder cargo
          "$hyprcross" daemon stop --all

      - name: Push
        if: needs.plan.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile.${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HYPRCROSS_REFRESH=${{ needs.plan.outputs.refresh }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
