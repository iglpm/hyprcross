# Built in each image by CI with hyprcross itself: the image's C toolchain compiles answer.c,
# its linker links the result, and on targets with a runner the test runs under it.
[package]
name = "hyprcross-smoke"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
cc = "1"

# Not part of any workspace above it.
[workspace]
